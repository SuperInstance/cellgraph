name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite is the README's "What runs" trio: three standalone scripts that
      # exit non-zero on failure (no pytest tests, no packaging files in this repo).
      # numpy is the only third-party import (cellgraph.py, tinyformer.py, multilayer.py,
      # all three test scripts) but no manifest declares it — install it explicitly.
      - run: python3 -m pip install --quiet numpy
      - run: python3 test_cellgraph.py
      - run: python3 test_localization.py
      - run: python3 test_findfault.py
